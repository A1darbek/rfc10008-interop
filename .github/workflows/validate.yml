name: validate
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Python syntax
        run: python -m py_compile runner/run.py runner/render_matrix.py
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: JSON validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').glob('**/*.json'):
              json.loads(p.read_text())
              print(p)
          PY
      - name: Render matrix without live network
        run: python runner/render_matrix.py
